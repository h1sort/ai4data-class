<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" role="img" aria-label="OLTP a ETL/ELT a OLAP con BI y ML, marcado por clase">
  <title>OLTP → ETL/ELT → OLAP (BI/ML), con qué clase tocó cada etapa</title>
  <defs>
    <marker id="me-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d23a26"/>
    </marker>
  </defs>
  <!-- OLTP -->
  <rect x="30" y="90" width="230" height="110" rx="8" fill="#eeede6" stroke="#ccc9be" stroke-width="1.5"/>
  <text x="145" y="140" font-family="'Space Mono',ui-monospace,monospace" font-size="19" font-weight="700" fill="#1a1915" text-anchor="middle">OLTP</text>
  <text x="145" y="163" font-family="'Space Mono',ui-monospace,monospace" font-size="11.5" fill="#46443c" text-anchor="middle">transacciones</text>
  <text x="145" y="180" font-family="'Space Mono',ui-monospace,monospace" font-size="11.5" fill="#46443c" text-anchor="middle">agente vía MCP/tools</text>

  <line x1="260" y1="145" x2="341" y2="145" stroke="#d23a26" stroke-width="2.5" marker-end="url(#me-arrow)"/>

  <!-- ETL/ELT -->
  <rect x="345" y="90" width="250" height="110" rx="8" fill="#eeede6" stroke="#ccc9be" stroke-width="1.5"/>
  <text x="470" y="140" font-family="'Space Mono',ui-monospace,monospace" font-size="17" font-weight="700" fill="#1a1915" text-anchor="middle">ETL / ELT</text>
  <text x="470" y="163" font-family="'Space Mono',ui-monospace,monospace" font-size="11.5" fill="#46443c" text-anchor="middle">extraer · modelar</text>
  <text x="470" y="180" font-family="'Space Mono',ui-monospace,monospace" font-size="11.5" fill="#46443c" text-anchor="middle">agente genera ETL</text>

  <line x1="595" y1="145" x2="681" y2="145" stroke="#d23a26" stroke-width="2.5" marker-end="url(#me-arrow)"/>

  <!-- OLAP outer -->
  <rect x="685" y="55" width="445" height="150" rx="10" fill="none" stroke="#928f84" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="705" y="78" font-family="'Space Mono',ui-monospace,monospace" font-size="13" font-weight="700" letter-spacing="0.08em" fill="#46443c">OLAP</text>

  <!-- BI -->
  <rect x="715" y="95" width="185" height="95" rx="7" fill="rgba(210,58,38,0.10)" stroke="#d23a26" stroke-width="1.5"/>
  <text x="807" y="130" font-family="'Space Mono',ui-monospace,monospace" font-size="16" font-weight="700" fill="#d23a26" text-anchor="middle">BI</text>
  <text x="807" y="152" font-family="'Space Mono',ui-monospace,monospace" font-size="10.5" fill="#46443c" text-anchor="middle">text-to-SQL</text>
  <text x="807" y="167" font-family="'Space Mono',ui-monospace,monospace" font-size="10.5" fill="#46443c" text-anchor="middle">análisis instantáneo</text>

  <!-- ML -->
  <rect x="930" y="95" width="180" height="95" rx="7" fill="rgba(210,58,38,0.10)" stroke="#d23a26" stroke-width="1.5"/>
  <text x="1020" y="130" font-family="'Space Mono',ui-monospace,monospace" font-size="16" font-weight="700" fill="#d23a26" text-anchor="middle">ML</text>
  <text x="1020" y="152" font-family="'Space Mono',ui-monospace,monospace" font-size="10.5" fill="#46443c" text-anchor="middle">clasificación</text>
  <text x="1020" y="167" font-family="'Space Mono',ui-monospace,monospace" font-size="10.5" fill="#46443c" text-anchor="middle">texto → columnas</text>

  <!-- marker badges -->
  <rect x="90" y="225" width="110" height="36" rx="4" fill="#f7f6f2" stroke="#d23a26" stroke-width="1.3"/>
  <text x="145" y="248" font-family="'Space Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" fill="#d23a26" text-anchor="middle">CLASE 1</text>

  <rect x="410" y="225" width="120" height="36" rx="4" fill="#f7f6f2" stroke="#d23a26" stroke-width="1.3"/>
  <text x="470" y="248" font-family="'Space Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" fill="#d23a26" text-anchor="middle">CLASE 2</text>

  <rect x="847" y="225" width="120" height="36" rx="4" fill="#d23a26" stroke="#d23a26" stroke-width="1.3"/>
  <text x="907" y="248" font-family="'Space Mono',ui-monospace,monospace" font-size="12.5" font-weight="700" fill="#f7f6f2" text-anchor="middle">HOY</text>
</svg>
