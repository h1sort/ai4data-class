<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-label="Harness alrededor del modelo: inyección de contexto, acción, observar y verificar, persistir, control">
  <title>El harness: la caja que rodea al modelo y hace determinista lo que puede</title>
  <defs>
    <marker id="hn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d23a26"/>
    </marker>
  </defs>
  <!-- outer harness boundary -->
  <rect x="30" y="30" width="760" height="500" rx="16" fill="none" stroke="#d23a26" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="55" y="66" font-family="'Space Mono',ui-monospace,monospace" font-size="14" font-weight="700" letter-spacing="0.08em" fill="#d23a26">HARNESS</text>
  <rect x="650" y="14" width="140" height="34" rx="4" fill="#d23a26"/>
  <text x="720" y="36" font-family="'Space Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#f7f6f2" text-anchor="middle">CONTROL</text>

  <!-- center: model -->
  <rect x="320" y="255" width="180" height="90" rx="8" fill="rgba(210,58,38,0.10)" stroke="#d23a26" stroke-width="1.5"/>
  <text x="410" y="292" font-family="'Space Mono',ui-monospace,monospace" font-size="17" font-weight="700" fill="#d23a26" text-anchor="middle">MODELO</text>
  <text x="410" y="313" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#46443c" text-anchor="middle">el LLM, en el centro</text>

  <!-- top: context injection -->
  <rect x="300" y="80" width="220" height="80" rx="8" fill="#eeede6" stroke="#ccc9be" stroke-width="1.5"/>
  <text x="410" y="112" font-family="'Space Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" fill="#1a1915" text-anchor="middle">INYECCIÓN DE CONTEXTO</text>
  <text x="410" y="132" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#46443c" text-anchor="middle">prompt · docs · historial</text>

  <!-- right: action -->
  <rect x="535" y="260" width="190" height="80" rx="8" fill="#eeede6" stroke="#ccc9be" stroke-width="1.5"/>
  <text x="630" y="292" font-family="'Space Mono',ui-monospace,monospace" font-size="14" font-weight="700" fill="#1a1915" text-anchor="middle">ACCIÓN</text>
  <text x="630" y="312" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#46443c" text-anchor="middle">tool call · efecto</text>

  <!-- bottom: observe & verify -->
  <rect x="290" y="430" width="240" height="80" rx="8" fill="#eeede6" stroke="#ccc9be" stroke-width="1.5"/>
  <text x="410" y="462" font-family="'Space Mono',ui-monospace,monospace" font-size="13.5" font-weight="700" fill="#1a1915" text-anchor="middle">OBSERVAR Y VERIFICAR</text>
  <text x="410" y="482" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#46443c" text-anchor="middle">resultado · error · checks</text>

  <!-- left: persist -->
  <rect x="100" y="260" width="180" height="80" rx="8" fill="#eeede6" stroke="#ccc9be" stroke-width="1.5"/>
  <text x="190" y="292" font-family="'Space Mono',ui-monospace,monospace" font-size="14" font-weight="700" fill="#1a1915" text-anchor="middle">PERSISTIR</text>
  <text x="190" y="312" font-family="'Space Mono',ui-monospace,monospace" font-size="11" fill="#46443c" text-anchor="middle">memoria · logs · estado</text>

  <!-- connectors -->
  <line x1="410" y1="160" x2="410" y2="253" stroke="#d23a26" stroke-width="2.2" marker-end="url(#hn-arrow)"/>
  <line x1="500" y1="300" x2="533" y2="300" stroke="#d23a26" stroke-width="2.2" marker-end="url(#hn-arrow)"/>
  <line x1="410" y1="347" x2="410" y2="428" stroke="#d23a26" stroke-width="2.2" marker-end="url(#hn-arrow)"/>
  <line x1="282" y1="300" x2="318" y2="300" stroke="#d23a26" stroke-width="2.2" marker-end="url(#hn-arrow)"/>
</svg>
